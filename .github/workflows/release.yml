name: Release verified Handoff
on:
  workflow_run:
    workflows: [Verify Handoff]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      candidate_commit:
        description: Exact successful CI and hosted source commit
        required: true
        type: string
      tag:
        description: Authorized release tag
        required: true
        default: v0.1.0
        type: string
permissions:
  contents: read
concurrency:
  group: handoff-release
  cancel-in-progress: false
env:
  CANDIDATE_COMMIT: ${{ github.event.workflow_run.head_sha || inputs.candidate_commit }}
  RELEASE_TAG: ${{ inputs.tag || 'v0.1.0' }}
jobs:
  attest:
    if: github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.CANDIDATE_COMMIT }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run compile
      - run: npx playwright install --with-deps chromium
      - run: node scripts/finalize-release.mjs self-test
      - name: Verify immutable candidate and deployed workflow
        run: node scripts/finalize-release.mjs verify
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: release-attestation-${{ env.CANDIDATE_COMMIT }}
          path: release-assets
          retention-days: 14
  publish:
    needs: attest
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ env.CANDIDATE_COMMIT }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.19.0
      - name: Fetch this run's verified attestation
        run: gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name "release-attestation-$CANDIDATE_COMMIT" --dir release-assets
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish annotated tag and verified assets
        run: node scripts/finalize-release.mjs publish
        env:
          GH_TOKEN: ${{ github.token }}
