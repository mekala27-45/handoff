name: Authenticate and prepare Handoff v5 results
on:
  push:
    branches: [agent-results-v5]
permissions:
  contents: read
concurrency:
  group: handoff-v5-results
  cancel-in-progress: false
jobs:
  verify-results:
    if: github.repository == 'mekala27-45/handoff'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    env:
      HANDOFF_MODEL_EXPERIMENT: v5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.19.0
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npm run compile
      - run: node --test build/tests/unit/model-v5.test.js build/tests/unit/recorded-v5.test.js build/tests/unit/model-publication-v5.test.js
      - run: node scripts/verify-model-v5.mjs self-test
      - name: Read explicit held-out source workflow
        id: request
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import {readFile,appendFile} from 'node:fs/promises';
          const request=JSON.parse(await readFile('docs/model-v5-results-request.json','utf8'));
          assert.deepEqual(Object.keys(request).sort(),['held_out_workflow_run_id','version']);
          assert.equal(request.version,5);assert.ok(Number.isSafeInteger(request.held_out_workflow_run_id)&&request.held_out_workflow_run_id>0);
          await appendFile(process.env.GITHUB_OUTPUT,'workflow_id='+request.held_out_workflow_run_id+'\n');
          JS
      - name: Authenticate and independently regrade original held-out evidence
        env:
          GH_TOKEN: ${{ github.token }}
          HELD_OUT_WORKFLOW: ${{ steps.request.outputs.workflow_id }}
        run: node scripts/verify-model-v5.mjs verify-heldout "$HELD_OUT_WORKFLOW"
      - name: Preserve original and sanitized publication evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/prepare-model-publication-v5.mjs
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: model-results-v5-${{ github.sha }}
          path: |
            reports/checks/model-v5-heldout.json
            reports/checks/model-v5-publication.json
          if-no-files-found: warn
          retention-days: 90
