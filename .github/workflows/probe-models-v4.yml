name: Inspect official Handoff v4 models
on:
  push:
    branches: [agent-quality-v4]
    paths: [scripts/probe-model-candidates-v4.mjs, .github/workflows/probe-models-v4.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24.19.0
      - run: node scripts/probe-model-candidates-v4.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: official-model-candidates-v4-${{ github.sha }}
          path: reports/checks/model-candidates-v4.json
          if-no-files-found: warn
          retention-days: 30
